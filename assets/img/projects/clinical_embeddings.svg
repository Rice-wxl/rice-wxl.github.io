<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Roboto, Helvetica, Arial, sans-serif">
  <rect width="800" height="500" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2b4c7e"/></marker>
  </defs>
  <!-- discharge summary -->
  <g transform="translate(40,120)">
    <path d="M0,0 h120 l30,30 v200 h-150 z" fill="#f4f7fb" stroke="#2b4c7e" stroke-width="3"/>
    <path d="M120,0 v30 h30" fill="none" stroke="#2b4c7e" stroke-width="3"/>
    <g fill="#8fb3e3"><rect x="18" y="50" width="110" height="9" rx="4"/><rect x="18" y="72" width="90" height="9" rx="4"/><rect x="18" y="94" width="115" height="9" rx="4"/><rect x="18" y="116" width="70" height="9" rx="4"/><rect x="18" y="138" width="105" height="9" rx="4"/><rect x="18" y="160" width="85" height="9" rx="4"/><rect x="18" y="182" width="100" height="9" rx="4"/></g>
    <text x="75" y="262" text-anchor="middle" font-size="20" fill="#333">discharge summary</text>
  </g>
  <line x1="205" y1="235" x2="265" y2="235" stroke="#2b4c7e" stroke-width="4" marker-end="url(#a)"/>
  <!-- LLM -->
  <rect x="275" y="165" width="190" height="140" rx="18" fill="#2b4c7e"/>
  <text x="370" y="228" text-anchor="middle" font-size="30" font-weight="700" fill="#fff">Llama 3</text>
  <text x="370" y="262" text-anchor="middle" font-size="18" fill="#dbe6f5">family, instruction-tuned</text>
  <line x1="475" y1="235" x2="535" y2="235" stroke="#2b4c7e" stroke-width="4" marker-end="url(#a)"/>
  <!-- embedding -->
  <g transform="translate(548,150)">
    <g fill="#8fb3e3">
      <rect x="0" y="0" width="22" height="22"/><rect x="0" y="26" width="22" height="22" fill="#2b4c7e"/><rect x="0" y="52" width="22" height="22" fill="#5b7fb3"/><rect x="0" y="78" width="22" height="22"/><rect x="0" y="104" width="22" height="22" fill="#2b4c7e"/><rect x="0" y="130" width="22" height="22" fill="#c9d9ef"/><rect x="0" y="156" width="22" height="22" fill="#5b7fb3"/>
    </g>
    <text x="11" y="212" text-anchor="middle" font-size="20" fill="#333">embedding</text>
  </g>
  <line x1="585" y1="235" x2="625" y2="235" stroke="#2b4c7e" stroke-width="4" marker-end="url(#a)"/>
  <!-- outcomes -->
  <g font-size="19" fill="#333">
    <rect x="635" y="160" width="130" height="40" rx="20" fill="#fdebdf" stroke="#e07a3f" stroke-width="2"/><text x="700" y="186" text-anchor="middle">sepsis?</text>
    <rect x="635" y="215" width="130" height="40" rx="20" fill="#fdebdf" stroke="#e07a3f" stroke-width="2"/><text x="700" y="241" text-anchor="middle">diagnoses</text>
    <rect x="635" y="270" width="130" height="40" rx="20" fill="#fdebdf" stroke="#e07a3f" stroke-width="2"/><text x="700" y="296" text-anchor="middle">outcomes</text>
  </g>
</svg>
