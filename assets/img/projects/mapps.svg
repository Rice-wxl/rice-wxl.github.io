<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Roboto, Helvetica, Arial, sans-serif">
  <rect width="800" height="500" fill="#ffffff"/>
  <!-- floor plan -->
  <g fill="#f4f7fb" stroke="#2b4c7e" stroke-width="3">
    <rect x="60" y="50" width="250" height="180"/>
    <rect x="310" y="50" width="200" height="180"/>
    <rect x="510" y="50" width="230" height="180"/>
    <rect x="60" y="230" width="680" height="80"/>
    <rect x="60" y="310" width="330" height="140"/>
    <rect x="390" y="310" width="350" height="140"/>
  </g>
  <!-- doors -->
  <g stroke="#f4f7fb" stroke-width="6">
    <line x1="160" y1="230" x2="200" y2="230"/><line x1="390" y1="230" x2="430" y2="230"/><line x1="600" y1="230" x2="640" y2="230"/>
    <line x1="200" y1="310" x2="240" y2="310"/><line x1="540" y1="310" x2="580" y2="310"/>
  </g>
  <!-- contacts -->
  <g stroke="#e07a3f" stroke-width="3" stroke-dasharray="6 5">
    <line x1="150" y1="120" x2="215" y2="160"/><line x1="215" y1="160" x2="250" y2="105"/>
    <line x1="420" y1="270" x2="480" y2="262"/><line x1="480" y1="262" x2="560" y2="280"/>
    <line x1="230" y1="380" x2="300" y2="400"/><line x1="590" y1="375" x2="650" y2="400"/>
  </g>
  <!-- agents -->
  <g fill="#2b4c7e">
    <circle cx="150" cy="120" r="13"/><circle cx="250" cy="105" r="13"/><circle cx="110" cy="185" r="13"/>
    <circle cx="380" cy="110" r="13"/><circle cx="450" cy="170" r="13"/>
    <circle cx="580" cy="120" r="13"/><circle cx="680" cy="170" r="13"/><circle cx="640" cy="90" r="13"/>
    <circle cx="420" cy="270" r="13"/><circle cx="560" cy="280" r="13"/><circle cx="160" cy="268" r="13"/>
    <circle cx="300" cy="400" r="13"/><circle cx="130" cy="360" r="13"/>
    <circle cx="650" cy="400" r="13"/><circle cx="470" cy="350" r="13"/>
  </g>
  <g fill="#e07a3f">
    <circle cx="215" cy="160" r="13"/><circle cx="480" cy="262" r="13"/><circle cx="230" cy="380" r="13"/><circle cx="590" cy="375" r="13"/>
  </g>
</svg>
